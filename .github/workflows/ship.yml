# Ship recording. Runs a project's ship specs (app/e2e/ship/<spec>) against a PR's immutable preview deployment with
# video on, slowed for a person to follow, and stitches one reel.mp4 with a title card per scenario.
# Two builds, picked at dispatch with `build`:
# - demo (the default): the PR's demo preview, found through the preview comment below.
# - test: the backend's test build (P2 on), built and served inside the `record` job at the PR's head SHA: the product
#   Worker under `wrangler dev` with a fresh local D1, migrated and seeded with the invented brand, and the test issuer.
#   Its key pair is made in the job for this run only, so nothing in the job is a secret.
# Manual only: workflow_dispatch runs from the default branch, so this file is trusted code. The PR's code runs only in
# the `record` job, which has read access and no secrets.
#
# The preview comment (written by preview.yml) is the first one from github-actions[bot] with the hidden marker
# `<!-- inhouse-preview -->` (preview.yml edits that one). The deployment URL is read only from its line starting
# `- Deployment URL` (host must end in .workers.dev) and the head SHA only from its line starting `- Head SHA`.
name: ship

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      spec:
        description: Ship spec file name under app/e2e/ship/ (for example example.spec.ts)
        required: true
        type: string
      build:
        description: What the spec runs against. demo is the PR's demo preview; test is the backend test build at the PR head
        required: false
        type: choice
        options: [demo, test]
        default: demo

permissions:
  contents: read

concurrency:
  group: ship-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Find the preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Only one of the two steps below runs. The test build has no deployment URL: the record job serves it.
      url: ${{ steps.find.outputs.url }}
      sha: ${{ steps.find.outputs.sha || steps.head.outputs.sha }}
    steps:
      - name: Check the inputs
        env:
          PR: ${{ inputs.pr }}
          SPEC: ${{ inputs.spec }}
          BUILD: ${{ inputs.build }}
        run: |
          [[ "$PR" =~ ^[1-9][0-9]{0,6}$ ]] || { echo "::error::pr must be a number"; exit 1; }
          [[ "$SPEC" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,80}\.spec\.ts$ ]] || { echo "::error::spec must be a file name like example.spec.ts"; exit 1; }
          [[ "$BUILD" =~ ^(demo|test)$ ]] || { echo "::error::build must be demo or test"; exit 1; }
      - name: Read the preview comment and check the PR head
        id: find
        if: inputs.build == 'demo'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/pulls/$PR")
          [ "$(jq -r .state <<< "$pr")" = open ] || { echo "::error::PR $PR is not open"; exit 1; }
          [ "$(jq -r .head.repo.full_name <<< "$pr")" = "$REPO" ] || { echo "::error::PR $PR is from a fork"; exit 1; }
          head=$(jq -r .head.sha <<< "$pr")
          # Only the workflow bot's comment counts: anyone can comment the marker.
          # Capture first, then take the first match: piping gh into head would SIGPIPE it under pipefail.
          all=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- inhouse-preview -->"))) | .body | @json')
          body=$(jq -rs '.[0] // empty' <<< "$all")
          [ -n "$body" ] || { echo "::error::No preview comment on PR $PR yet"; exit 1; }
          sha=$(grep -E '^- Head SHA' <<< "$body" | grep -oE '[0-9a-f]{40}' | head -n 1 || true)
          url=$(grep -E '^- Deployment URL' <<< "$body" | grep -oE 'https://[^][:space:])>`*"]+' | head -n 1 || true)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No head SHA in the preview comment"; exit 1; }
          [[ "$url" =~ ^https://[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.workers\.dev(/[A-Za-z0-9._~/-]*)?$ ]] || { echo "::error::No deployment URL in the preview comment"; exit 1; }
          if [ "$sha" != "$head" ]; then
            echo "::error::The preview is for ${sha:0:7} but the PR head is ${head:0:7}. Wait for the new preview and run again."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # The test build is built from the head SHA itself, so there's no preview to match against.
      - name: Check the PR and take its head
        id: head
        if: inputs.build == 'test'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/pulls/$PR")
          [ "$(jq -r .state <<< "$pr")" = open ] || { echo "::error::PR $PR is not open"; exit 1; }
          [ "$(jq -r .head.repo.full_name <<< "$pr")" = "$REPO" ] || { echo "::error::PR $PR is from a fork"; exit 1; }
          head=$(jq -r .head.sha <<< "$pr")
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No head SHA for PR $PR"; exit 1; }
          echo "sha=$head" >> "$GITHUB_OUTPUT"

  record:
    name: Record
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Same image as ci.yml: keep the tag and digest in step with it. The image's ffmpeg can't make mp4 and there's no
    # apt here, so stitching is the next job.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      # --add-host: the test build's origins (brand.localhost, inhouse.localhost) must also resolve for Node-side
      # requests in a spec (Chromium maps *.localhost to loopback itself; glibc in this image doesn't). Harmless in demo.
      options: --user 1001 --ipc=host --add-host brand.localhost:127.0.0.1 --add-host inhouse.localhost:127.0.0.1
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check the inputs
        working-directory: .
        env:
          PR: ${{ inputs.pr }}
          SPEC: ${{ inputs.spec }}
        run: |
          [[ "$PR" =~ ^[1-9][0-9]{0,6}$ ]] || { echo "::error::pr must be a number"; exit 1; }
          [[ "$SPEC" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,80}\.spec\.ts$ ]] || { echo "::error::spec must be a file name like example.spec.ts"; exit 1; }
        shell: bash
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - run: npm ci
      - name: Record ${{ inputs.spec }}
        if: inputs.build == 'demo'
        env:
          SHIP: "1"
          BASE_URL: ${{ needs.resolve.outputs.url }}
          SPEC: ${{ inputs.spec }}
          VERIFY_DIR: e2e-artifacts/ship
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-artifacts/ship/report.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: e2e-artifacts/ship/report
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          [ -f "e2e/ship/$SPEC" ] || { echo "::error::e2e/ship/$SPEC doesn't exist at this commit"; exit 1; }
          npx playwright test "e2e/ship/$SPEC" --project=ship-desktop --project=ship-phone --forbid-only --reporter=list,html,json
      # Test build (P2 on). The scripts land in P2's PR0; a PR without them fails here, before anything is built.
      - name: Check the test build scripts
        if: inputs.build == 'test'
        run: |
          # shellcheck disable=SC2016 # the quoted text is JavaScript
          node -e '
            const scripts = require("./package.json").scripts ?? {}
            const missing = ["build:product-test", "test-build:migrate", "test-build:seed"].filter(s => !scripts[s])
            if (missing.length) {
              console.log(`::error::This commit has no test build: package.json lacks ${missing.join(", ")}. They land in P2 PR0; dispatch with build=demo for an earlier PR.`)
              process.exit(1)
            }'
          [ -f "e2e/ship/$SPEC" ] || { echo "::error::e2e/ship/$SPEC doesn't exist at this commit"; exit 1; }
        env:
          SPEC: ${{ inputs.spec }}
        shell: bash
      - name: Build the test build
        if: inputs.build == 'test'
        run: npm run build:product-test
      # One step, so the server lives exactly as long as the spec run. The key pair is this run's own test issuer key:
      # the Worker gets only the public JWKS (TEST_ISSUER_JWKS), the spec gets the private JWK's file to sign members in.
      # Readiness is a condition: /api/health answers 401 to a request without a JWT (every /api/* route authenticates
      # first), on the brand origin. Until the deadline it waits through refused connections and 5xx (a Worker or binding
      # still loading); any other status fails at once. The server's log is printed when it doesn't come up.
      - name: Record ${{ inputs.spec }} on the test build
        if: inputs.build == 'test'
        env:
          SHIP: "1"
          SPEC: ${{ inputs.spec }}
          TEST_BUILD_PORT: "8787"
          WRANGLER_SEND_METRICS: "false"
          VERIFY_DIR: e2e-artifacts/ship
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-artifacts/ship/report.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: e2e-artifacts/ship/report
          PLAYWRIGHT_HTML_OPEN: never
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          configs=(dist-product-test/*/wrangler.json)
          [ "${#configs[@]}" -eq 1 ] || { echo "::error::Expected one Worker config in dist-product-test/, found ${#configs[@]}"; exit 1; }
          work="$RUNNER_TEMP/test-build"
          state="$work/state"
          keys="$work/issuer"
          log="$work/wrangler-dev.log"
          mkdir -p "$state" "$keys"
          chmod 700 "$keys"
          # shellcheck disable=SC2016 # JavaScript
          node --input-type=module -e '
            import { generateKeyPairSync, randomUUID } from "node:crypto"
            import { writeFileSync } from "node:fs"
            const dir = process.argv[1]
            const kid = randomUUID()
            const { publicKey, privateKey } = generateKeyPairSync("rsa", { modulusLength: 2048 })
            const pub = { ...publicKey.export({ format: "jwk" }), kid, alg: "RS256", use: "sig" }
            writeFileSync(`${dir}/jwks.json`, JSON.stringify({ keys: [pub] }))
            writeFileSync(`${dir}/private.jwk.json`, JSON.stringify({ ...privateKey.export({ format: "jwk" }), kid, alg: "RS256" }), { mode: 0o600 })
          ' "$keys"
          npm run test-build:migrate -- --persist-to "$state"
          npm run test-build:seed -- --persist-to "$state"
          npx wrangler dev -c "${configs[0]}" --ip 127.0.0.1 --port "$TEST_BUILD_PORT" --persist-to "$state" \
            --var "TEST_ISSUER_JWKS:$(cat "$keys/jwks.json")" > "$log" 2>&1 &
          server=$!
          # shellcheck disable=SC2016 # expands when the trap runs
          trap 'kill "$server" 2>/dev/null || true' EXIT
          # shellcheck disable=SC2016 # JavaScript
          if ! node -e '
            const http = require("node:http")
            const [pid, port] = process.argv.slice(1).map(Number)
            const deadline = Date.now() + 120_000
            let last = 0
            const probe = () => new Promise(resolve => {
              const req = http.get({ host: "127.0.0.1", port, path: "/api/health", headers: { host: `brand.localhost:${port}` } }, res => { res.resume(); resolve(res.statusCode) })
              req.on("error", () => resolve(0))
              req.setTimeout(5_000, () => req.destroy())
            })
            const alive = () => { try { process.kill(pid, 0); return true } catch { return false } }
            const run = async () => {
              for (;;) {
                if (!alive()) { console.log("::error::wrangler dev exited before it answered"); process.exit(1) }
                const status = await probe()
                if (status === 401) { console.log("The test build is up: /api/health answers 401 without a JWT"); return }
                if (status !== 0 && status < 500) { console.log(`::error::/api/health answered ${status} without a JWT, expected 401`); process.exit(1) }
                last = status
                if (Date.now() > deadline) { console.log(`::error::The test build did not answer 401 within 120 s (last status: ${last || "no answer"})`); process.exit(1) }
                await new Promise(r => setTimeout(r, 500))
              }
            }
            run()' "$server" "$TEST_BUILD_PORT"; then
            echo "--- wrangler dev log (last 200 lines) ---"; tail -n 200 "$log"; exit 1
          fi
          BASE_URL="http://brand.localhost:$TEST_BUILD_PORT" \
          TEST_BUILD_INHOUSE_URL="http://inhouse.localhost:$TEST_BUILD_PORT" \
          TEST_ISSUER_PRIVATE_JWK_FILE="$keys/private.jwk.json" \
            npx playwright test "e2e/ship/$SPEC" --project=ship-desktop --project=ship-phone --forbid-only --reporter=list,html,json \
            || { rc=$?; echo "--- wrangler dev log (last 200 lines) ---"; tail -n 200 "$log"; exit "$rc"; }
      - name: Every test has a video, and at least one ran
        if: ${{ !cancelled() }}
        run: node scripts/ship-report.mjs check e2e-artifacts/ship/report.json e2e-artifacts/ship/results
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ship-record
          path: app/e2e-artifacts/ship
          retention-days: 7

  reel:
    name: Stitch the reel
    needs: [resolve, record]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # The default branch's copy of the stitch scripts, never the PR's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: app/scripts
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ship-record
          path: ship
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Build reel.mp4
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          mkdir -p out
          app/scripts/ship-reel.sh ship/report.json ship/results "$SHA" out/reel.mp4
          cp -r ship/report out/report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ship-pr-${{ inputs.pr }}
          path: out
          retention-days: 14

  comment:
    name: Comment the run link
    needs: [resolve, reel]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Post
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          SPEC: ${{ inputs.spec }}
          SHA: ${{ needs.resolve.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ON: ${{ inputs.build == 'test' && ' on the test build' || '' }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Ship recording of \`$SPEC\` at \`${SHA:0:7}\`$ON: reel.mp4 and the report are in the artifact \`ship-pr-$PR\` on [this run]($RUN_URL)."
