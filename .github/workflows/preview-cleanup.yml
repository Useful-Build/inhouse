# Deletes the Workers Previews (pr-<number>, from preview.yml) of PRs closed in the last few days. Daily, or by
# hand: gh workflow run preview-cleanup [-f days=30]. Wrangler has no command that lists previews, so it tries
# each recently closed PR and treats a preview that doesn't exist as already gone.
name: preview-cleanup

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: Delete previews of PRs closed in the last this many days (1 to 365)
        required: false
        default: "7"

permissions: {}

jobs:
  closed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      prs: ${{ steps.list.outputs.prs }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAYS: ${{ inputs.days || '7' }}
        run: |
          [[ "$DAYS" =~ ^[0-9]+$ ]] && [ "$DAYS" -ge 1 ] && [ "$DAYS" -le 365 ] ||
            { echo "::error::days must be a whole number from 1 to 365"; exit 1; }
          since=$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
          # The 100 most recently updated closed PRs cover any PR closed in the window.
          prs=$(SINCE="$since" gh api "repos/$REPO/pulls?state=closed&sort=updated&direction=desc&per_page=100" \
            --jq '[.[] | select(.closed_at >= env.SINCE) | .number]')
          echo "Closed since $since: $prs"
          echo "prs=$prs" >> "$GITHUB_OUTPUT"

  delete:
    needs: closed
    if: needs.closed.outputs.prs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pr: ${{ fromJSON(needs.closed.outputs.prs) }}
    # Same group as preview.yml's run for this PR: a delete waits for a deploy in progress, then removes it.
    concurrency:
      group: preview-pr-${{ matrix.pr }}
      cancel-in-progress: false
    steps:
      # main's code and lockfile: wrangler is the version pinned on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.nvmrc
      - working-directory: app
        run: npm ci
      - name: Delete preview pr-${{ matrix.pr }}
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          PR: ${{ matrix.pr }}
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::Bad PR number"; exit 1; }
          if out=$(npx --no-install wrangler preview delete --name "pr-$PR" --worker-name inhouse-app \
            --skip-confirmation 2>&1); then
            echo "$out"; echo "Deleted pr-$PR"; exit 0
          fi
          echo "$out"
          # A preview that was never made, or is already deleted, is fine. Any other failure is not.
          if grep -qiE 'not found|does not exist|could not find|no preview' <<< "$out"; then
            echo "pr-$PR has no preview"
          else
            echo "::error::Deleting pr-$PR failed"; exit 1
          fi
