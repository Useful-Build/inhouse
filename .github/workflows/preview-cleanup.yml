# Deletes the Workers Previews (pr-<number>, from preview.yml) of closed PRs. Daily for PRs closed in the last
# 7 days, so a missed run or a deploy that finished just after a PR closed still gets cleaned up, or by hand for
# another window: gh workflow run preview-cleanup [-f days=30]. Wrangler has no command that lists previews, so it
# tries each closed PR and treats a preview that doesn't exist as already gone (a cheap not-found).
name: preview-cleanup

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: Delete previews of PRs closed in the last this many days (1 to 365)
        required: false
        default: "7"

permissions: {}

jobs:
  closed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      prs: ${{ steps.list.outputs.prs }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAYS: ${{ inputs.days || '7' }}
        run: |
          [[ "$DAYS" =~ ^[0-9]+$ ]] && [ "$DAYS" -ge 1 ] && [ "$DAYS" -le 365 ] ||
            { echo "::error::days must be a whole number from 1 to 365"; exit 1; }
          since=$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
          # Every closed PR, every page. A PR closed in the window was updated in it too.
          numbers=$(SINCE="$since" gh api --paginate "repos/$REPO/pulls?state=closed&sort=updated&direction=desc&per_page=100" \
            --jq '.[] | select(.closed_at >= env.SINCE) | .number')
          prs=$(jq -cs . <<< "$numbers")
          count=$(jq length <<< "$prs")
          # A matrix holds at most 256 jobs.
          [ "$count" -le 256 ] || { echo "::error::$count PRs closed since $since. Use a smaller days."; exit 1; }
          echo "Closed since $since: $prs"
          echo "prs=$prs" >> "$GITHUB_OUTPUT"

  delete:
    needs: closed
    if: needs.closed.outputs.prs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pr: ${{ fromJSON(needs.closed.outputs.prs) }}
    # Same group as preview.yml's run for this PR: a delete waits for a deploy in progress, then removes it.
    concurrency:
      group: preview-pr-${{ matrix.pr }}
      cancel-in-progress: false
    steps:
      # main's code and lockfile: wrangler is the version pinned on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.nvmrc
      # --ignore-scripts: this job holds a secret, so no package's install script runs here (a version bump can't
      # run code at install). None is needed: esbuild and workerd find their binaries in their optional platform
      # packages, and app/'s prepare only sets git hooks. ci.yml's ignore-scripts job proves these commands per PR.
      - working-directory: app
        run: npm ci --ignore-scripts
      - name: Delete preview pr-${{ matrix.pr }}
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          PR: ${{ matrix.pr }}
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::Bad PR number"; exit 1; }
          if out=$(npx --no-install wrangler preview delete --name "pr-$PR" --worker-name inhouse-app \
            --skip-confirmation 2>&1); then
            echo "$out"; echo "Deleted pr-$PR"; exit 0
          fi
          echo "$out"
          # A preview that was never made, or is already deleted, is fine. Any other failure is not. Wrangler
          # 4.162.0 passes the API's error through: "A request to the Cloudflare API (<path>) failed." then the
          # message with "[code: 10025]" (PREVIEW_NOT_FOUND_ERR_CODE in src/preview/secrets/index.ts).
          if grep -qF "/workers/workers/inhouse-app/previews/pr-$PR) failed." <<< "$out" &&
            grep -qF "[code: 10025]" <<< "$out"; then
            echo "pr-$PR has no preview"
          else
            echo "::error::Deleting pr-$PR failed"; exit 1
          fi
