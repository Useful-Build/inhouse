# The 30 fps motion check (UI_PLAN_2, PR 5): gh workflow run motion --ref <branch>. It records sending, streaming and
# finishing an answer on desktop and a 390px phone, samples every animation frame, and fails on a scroll jump. It
# uploads the videos and the per-frame JSON as the motion artifact, even when the check fails. Same image as ci.yml.
name: motion

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Same image as ci.yml: bump the tag and digest together, everywhere.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --user 1001 --ipc=host
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci
      # MOTION adds the motion project to the config; no other run has it.
      - run: npx playwright test --project=motion
        env:
          MOTION: "1"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: motion
          path: |
            app/e2e-artifacts/results/**/*.webm
            app/e2e-artifacts/results/**/frames-*.json
          if-no-files-found: warn
          retention-days: 14
