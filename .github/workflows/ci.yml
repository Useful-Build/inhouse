# The required check for main and fleet/** (job name "ci"). Runs on PRs and on dispatch. The merge_group trigger is kept
# for a merge queue, which is off for now (see AGENTS.md, "How changes land here").
# The app's whole suite runs in app/: type check, lint, build and every Playwright project, in the official
# Playwright image so screenshots render the same on every run. Two shards at most: runner slots are shared.
name: ci

on:
  pull_request:
    branches: [main, "fleet/**"]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only a new commit cancels a running run. A reopen or ready_for_review on the same commit queues behind it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  e2e:
    name: e2e (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The image's version must match @playwright/test in app/package.json (also in .github/workflows/baselines.yml
    # and app/package.json's test:visual:linux scripts). Bump the tag and digest together, everywhere.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --user 1001 --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            parts: 1/4 3/4
          - shard: 2
            parts: 2/4 4/4
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci
      - if: matrix.shard == 1
        run: npm run typecheck
      - if: matrix.shard == 1
        run: npm run lint
      - if: matrix.shard == 1
        run: node --version && npm run test:unit
      - run: npm run build
        env:
          # The commit the client reports its errors from: a preview reports its PR head, not the merge commit.
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # The gzip budget on the JS Today's first load needs (production plan P-2). Prints the sizes, fails over BUDGET_KB.
      - if: matrix.shard == 1
        run: node scripts/check-bundle.mjs
      # The built app, for preview.yml (trusted code on main) to deploy as this PR's Workers Preview. This job
      # holds no secrets, ever. include-hidden-files: wrangler's redirect file lives under .wrangler/.
      - if: matrix.shard == 1 && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-build
          path: |
            app/dist
            app/.wrangler/deploy/config.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      # Which PR this build is for and the merge commit it was built from, for preview.yml to check and show.
      - if: matrix.shard == 1 && github.event_name == 'pull_request'
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
        run: printf '{"pr":%s,"sha":"%s"}\n' "$PR" "$SHA" > pr-meta.json
      - if: matrix.shard == 1 && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-meta
          path: app/pr-meta.json
          if-no-files-found: error
          retention-days: 7
      # Playwright balances shards by test count, not time, and the slow desktop specs come first. So the
      # suite is cut in four by test (--fully-parallel) and each job runs one slow and one fast quarter.
      # One worker: the tests run one at a time. Every quarter runs even if the one before failed.
      # E2E_PREBUILT: the web server serves the build above instead of building again for each quarter.
      - name: Playwright, quarters ${{ matrix.parts }}
        env:
          E2E_PREBUILT: "1"
        run: |
          rc=0
          for part in ${{ matrix.parts }}; do
            VERIFY_DIR="e2e-artifacts/quarter-${part%/*}" npx playwright test --forbid-only --fully-parallel --shard="$part" || rc=1
          done
          exit $rc
      # The product build (P1, C8) must ship no sample data, mock code, demo controls, demo clock or demo files, and the
      # check must catch each of those in the demo build. Runs after the demo quarters and whether or not they passed, and
      # a failure here doesn't skip them (they come first): the job still fails. The product build puts the demo's deploy
      # pointer back when it ends, so the uploaded demo build is untouched either way.
      # P2: the test build too (built after, never beside, the product build), for the check's server bundle scan: no
      # test issuer in the deployable Worker, and the canary found in the test build's.
      - if: matrix.shard == 1 && !cancelled()
        run: npm run build:product && npm run build:product-test && node scripts/check-product-build.mjs
      # The product build's own specs (e2e/product/): no sample name, no demo switches, the "Not connected
      # yet" screen. Right after the build it serves (dist-product/, via wrangler dev, so the demo's deploy pointer that
      # `vite preview` follows stays on dist/). E2E_PREBUILT keeps the demo server Playwright also starts from building
      # again, so nothing rebuilds beside the product. Its artifacts sit under e2e-artifacts/ so a failure uploads with
      # the shard's. It runs even when the check above failed, so one log shows both.
      - if: matrix.shard == 1 && !cancelled()
        env:
          E2E_PRODUCT: "1"
          E2E_PREBUILT: "1"
          VERIFY_DIR: e2e-artifacts/product
        run: npx playwright test --project=product --forbid-only
      - if: ${{ !success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-shard-${{ matrix.shard }}
          path: app/e2e-artifacts
          retention-days: 7

  # The TEST BUILD (P2, p2-design section 10): the product Worker under `wrangler dev` with a fresh local D1 and the
  # test issuer. No secret anywhere: the issuer's key pair is made per run and only its public half reaches the Worker.
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The same image as e2e (keep the tag and digest in step with it).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      # --add-host: Node's resolver doesn't always resolve *.localhost on a runner (ENOTFOUND brand.localhost), so pin the test build's hosts.
      options: --user 1001 --ipc=host --add-host=brand.localhost:127.0.0.1 --add-host=inhouse.localhost:127.0.0.1
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci
      - run: npm run build:product-test
      # The migration job, fresh install: every migration in server/migrations/ on an empty local D1. From P3 it also
      # upgrades from the last release tag and runs that tag's API specs on the new schema.
      - name: Migrations, fresh install
        run: rm -rf .wrangler/test-build && npm run test-build:migrate
      # The deployable-config check must refuse the test build's config (it sets the test flag and test origins).
      # The script's fixture tests run with test:unit (e2e shard 1).
      # Its exit codes (AGENTS.md): 0 deployable, 1 refused, 2 usage or a crash. Only 1 counts as refusing here: a crash
      # (2) or any other code fails this step too.
      - name: The config check refuses wrangler.test.jsonc
        if: ${{ !cancelled() }}
        run: |
          rc=0
          node scripts/check-product-config.mjs wrangler.test.jsonc || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::check-product-config.mjs exited $rc on wrangler.test.jsonc; it must refuse it with exit code 1 (0 = passed a config that must never deploy, 2 = usage or a crash)."
            exit 1
          fi
          echo "check-product-config.mjs refused wrangler.test.jsonc (exit 1), as it must."
      # The api and real projects. Their web server migrates and seeds a fresh local D1 first (prepare.mjs).
      - name: Playwright, api and real
        if: ${{ !cancelled() }}
        env:
          E2E_TEST_BUILD: "1"
          VERIFY_DIR: e2e-artifacts/test-build
        run: npx playwright test --project=api --project=real-desktop --project=real-phone --forbid-only
      # The release smoke on the test build (e2e/smoke/, read only, request only): the same checks a release runs with
      # Access service-token headers instead of the test issuer. After the api project, which proves the routes it reads.
      - name: Playwright, release smoke
        if: ${{ !cancelled() }}
        env:
          E2E_TEST_BUILD: "1"
          # Its own folder: Playwright empties its output folder at the start of a run, which would wipe the api and real
          # failure artifacts before the upload below (its path, app/e2e-artifacts, covers both folders).
          VERIFY_DIR: e2e-artifacts/test-build-smoke
        run: npx playwright test --project=smoke --forbid-only
      # The contract suite with the real client's target added (CONTRACT_REAL_ORIGIN), against a fresh test build.
      - name: Contract suite on the real client
        if: ${{ !cancelled() }}
        run: node e2e/support/test-build/serve.ts -- npx vitest run src/agent/contract
      - if: ${{ !success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-build
          path: app/e2e-artifacts
          retention-days: 7

  ci:
    needs: [e2e, test-build]
    # always(): a cancelled or skipped shard makes ci red, never skipped (a skipped check counts as passing).
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.e2e.result }}
          TEST_BUILD: ${{ needs.test-build.result }}
        run: |
          echo "e2e: $RESULT"
          echo "test-build: $TEST_BUILD"
          if [ "$RESULT" = cancelled ] || [ "$TEST_BUILD" = cancelled ]; then
            echo "::error::The e2e or test-build jobs were cancelled or superseded by a newer run. This is not a test failure: see the newest run for this branch."
          fi
          test "$RESULT" = success && test "$TEST_BUILD" = success

  pr-gates:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Dependabot's commits carry no trailer. A PR's author login is set by GitHub, unlike a commit's author.
      - name: Every commit has a Verified trailer
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          missing=""
          # A missing ref would make git log fail inside the for list, which bash doesn't stop on: fail loudly instead.
          git rev-parse --verify -q "refs/remotes/origin/$DEFAULT" > /dev/null || { echo "::error::No refs/remotes/origin/$DEFAULT"; exit 1; }
          # Commits already on the default branch passed this gate in their own PR; a PR that brings main into a
          # fleet/<topic> branch carries them again (squash commits there can't be rewritten), so skip them.
          for c in $(git log --no-merges --format=%H "$BASE..$HEAD" --not "refs/remotes/origin/$DEFAULT"); do
            t=$(git log -1 --format=%B "$c" | git interpret-trailers --parse)
            grep -qiE '^Verified:[[:space:]]*[^[:space:]]' <<< "$t" ||
              missing="$missing$(git log -1 --format='%h %s' "$c")"$'\n'
          done
          if [ -n "$missing" ]; then
            echo "::error::Commits without a Verified: trailer:"; printf '%s' "$missing"; exit 1
          fi
      - name: Flag changes to existing checks
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          paths=(app/e2e app/playwright.config.ts app/vitest.config.ts app/scripts .github/workflows .github/rulesets
            ':(glob)app/src/**/*.property.test.ts')
          files=$(git -c core.quotepath=off diff --name-status --diff-filter=MDR "$BASE...$HEAD" -- "${paths[@]}")
          [ -z "$files" ] && exit 0
          { echo "### Changed existing checks"; echo '```'; echo "$files"; echo '```'
            echo "Reviewer: the PR body must explain each one."; } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::This PR changes existing checks. See the job summary."
