# The required check for main and fleet/** (job name "ci"). Runs on PRs, on push to fleet/** and on dispatch. The
# merge_group trigger is kept for a merge queue, which is off for now (see AGENTS.md, "How changes land here").
# The app's whole suite runs in app/: type check, lint, build and every Playwright project, in the official
# Playwright image so screenshots render the same on every run. Four e2e jobs, one quarter of the suite each, so the
# longest job is about half what two jobs of two quarters took (test merge policy, Wasim, 2026-11-26). A PR into main
# runs at most 8 jobs at once (changes first, then 4 e2e, test-build, runner and hub, with pr-gates beside them; ci
# after), under GitHub Free's 20 concurrent jobs.
# Docs-only fast path (same policy): when every changed file is documentation (the changes job below says exactly
# what counts), e2e, test-build, runner, hub and fast skip, and ci passes on that skip alone. pr-gates runs as always.
# Phase batching (Wasim, 2026-11-21): a PR into a fleet/** branch runs only the fast checks (the fast job: type check,
# lint, unit, the builds and their guards, the fresh-install migrations; the runner job without its image and container
# probes). ci doesn't listen to a base change (pull_request: edited), so a PR retargeted from fleet/** to main keeps its
# fast-path ci: never retarget one (AGENTS.md, "How changes land here"). The whole suite
# runs on every push to fleet/** (each merge into the phase branch; a newer merge cancels the run in progress, so a
# burst of merges costs one run), on every PR into main and on dispatch. "Fleet PR" below means exactly:
#   github.event_name == 'pull_request' && startsWith(github.base_ref, 'fleet/')
name: ci

on:
  pull_request:
    branches: [main, "fleet/**"]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["fleet/**"]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A push to fleet/** has its own group per branch, and the newest merge cancels the run in progress. A PR's group
  # (refs/pull/<n>/merge) is as before.
  group: ${{ github.event_name == 'push' && format('ci-push-{0}', github.ref) || format('ci-{0}', github.ref) }}
  # On a PR only a new commit cancels a running run. A reopen or ready_for_review on the same commit queues behind it.
  cancel-in-progress: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action == 'synchronize') }}

jobs:
  # Is this run docs-only? Every job but pr-gates waits on this answer (about 15 seconds). "Docs-only" means every changed
  # file is a .md file outside app/ and .github/, and no code in app/ names it by path (docs/data-map.md is read by a
  # unit test, for one). A .md under app/ can be a fixture, a skill the runner image ships or an eval result, and
  # anything under .github/ is CI itself, so those always run everything. The changed files, by event:
  # - pull_request: the PR's own changes, base...head (from the merge base, as the PR's file view shows them);
  # - merge_group: the queue branch against main (main...head_sha). Not base_sha..head_sha: base_sha is the group's
  #   parent, which is the entry queued ahead, not main, so a docs PR behind a code PR would see only its own files;
  # - push to fleet/**: the whole branch against main (main...sha), never just this push: a newer push cancels the run
  #   in progress, so a docs push right after a code merge must not leave that code untested;
  # - dispatch, or anything unsure (a missing SHA, a failed diff, no files): a full run.
  # git only, no path-filter action. Full history, as pr-gates has, for the merge base.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Docs-only or a full run
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
          SHA: ${{ github.sha }}
        run: |
          verdict() { echo "docs_only=$1" >> "$GITHUB_OUTPUT"; echo "docs-only: $1 ($2)"; exit 0; }
          sha() { [[ "$1" =~ ^[0-9a-f]{40}$ ]]; }
          case "$EVENT" in
            pull_request) sha "$PR_BASE" && sha "$PR_HEAD" && range="$PR_BASE...$PR_HEAD" ;;
            merge_group) sha "$MQ_HEAD" && range="origin/main...$MQ_HEAD" ;;
            push) sha "$SHA" && range="origin/main...$SHA" ;;
            *) verdict false "a $EVENT run always runs everything" ;;
          esac
          [ -n "${range:-}" ] || verdict false "no SHAs to compare for this $EVENT event"
          # --no-renames: a rename shows both paths, so code renamed to .md still counts as a code change.
          files=$(git -c core.quotepath=off diff --no-renames --name-only "$range") || verdict false "git diff $range failed"
          [ -n "$files" ] || verdict false "git diff $range lists no files"
          echo "Changed files ($range):"; printf '%s\n' "$files"
          while IFS= read -r f; do
            case "$f" in
              .github/*|app/*) verdict false "$f is under .github/ or app/" ;;
              *.md) ;;
              *) verdict false "$f is not a .md file" ;;
            esac
            # git grep: 0 found, 1 not found, anything else an error (and so unsure).
            rc=0; git grep -qF -e "../$f" -e "'$f'" -e "\"$f\"" -e "\`$f\`" -- app ':!*.md' || rc=$?
            [ "$rc" = 0 ] && verdict false "code in app/ names $f by path, so a test may read it"
            [ "$rc" = 1 ] || verdict false "git grep for $f failed (exit $rc)"
          done <<< "$files"
          verdict true "every changed file is documentation"

  e2e:
    name: e2e (${{ matrix.shard }}/4)
    needs: changes
    # Not on a docs-only run, and not on a fleet PR (the fast job stands in; its branch's push runs e2e instead).
    if: ${{ needs.changes.outputs.docs_only == 'false' && !(github.event_name == 'pull_request' && startsWith(github.base_ref, 'fleet/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The image's version must match @playwright/test in app/package.json (also in .github/workflows/baselines.yml,
    # .github/workflows/targeted.yml and app/package.json's test:visual:linux scripts). Bump the tag and digest
    # together, everywhere.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --user 1001 --ipc=host
    # Playwright balances shards by test count, not time, so the suite is cut in four by test (--fully-parallel) and
    # each job runs one quarter, one test at a time. Quarter times on 2026-11-27 (#451's run): 1/4 8.6 min, 2/4 10.0,
    # 3/4 8.6, 4/4 3.2. The other work goes where it keeps the longest job shortest: the unit suite (6 to 8 min) on the
    # fast quarter 4, the product builds and project on 3, type check, lint, the bundle check and the preview build on 1,
    # and 2 runs its quarter alone. Each job builds the demo once and its quarter serves that build.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci
      - if: matrix.shard == 1
        run: npm run typecheck
      - if: matrix.shard == 1
        run: npm run lint
      # The unit suite runs beside the shortest quarter.
      - if: matrix.shard == 4
        run: node --version && npm run test:unit
      - run: npm run build
        env:
          # The commit the client reports its errors from: a preview reports its PR head, not the merge commit.
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # The gzip budget on the JS Today's first load needs (production plan P-2). Prints the sizes, fails over BUDGET_KB.
      - if: matrix.shard == 1
        run: node scripts/check-bundle.mjs
      # The built app, for preview.yml (trusted code on main) to deploy as this PR's Workers Preview. This job
      # holds no secrets, ever. include-hidden-files: wrangler's redirect file lives under .wrangler/.
      - if: matrix.shard == 1 && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-build
          path: |
            app/dist
            app/.wrangler/deploy/config.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      # Which PR this build is for and the merge commit it was built from, for preview.yml to check and show.
      - if: matrix.shard == 1 && github.event_name == 'pull_request'
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
        run: printf '{"pr":%s,"sha":"%s"}\n' "$PR" "$SHA" > pr-meta.json
      - if: matrix.shard == 1 && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-meta
          path: app/pr-meta.json
          if-no-files-found: error
          retention-days: 7
      # This job's quarter. E2E_PREBUILT: the web server serves the build above instead of building again.
      - name: Playwright, quarter ${{ matrix.shard }}/4
        env:
          E2E_PREBUILT: "1"
          VERIFY_DIR: e2e-artifacts/quarter-${{ matrix.shard }}
          SHARD: ${{ matrix.shard }}/4
        run: npx playwright test --forbid-only --fully-parallel --shard="$SHARD"
      # The product build (P1, C8) must ship no sample data, mock code, demo controls, demo clock or demo files, and the
      # check must catch each of those in the demo build. Runs after the demo quarter and whether or not it passed, and
      # a failure here doesn't skip it (it comes first): the job still fails. The product build puts the demo's deploy
      # pointer back when it ends, so the demo build is untouched either way.
      # P2: the test build too (built after, never beside, the product build), for the check's server bundle scan: no
      # test issuer in the deployable Worker, and the canary found in the test build's.
      # The eval build too (p3-eval-observability rev 2, rec 1), for part 6: the eval trace in neither the deployable
      # Worker nor the test build, its canary found in the eval build's, and no scripted model there.
      - if: matrix.shard == 3 && !cancelled()
        run: npm run build:product && npm run build:product-test && npm run build:product-eval && node scripts/check-product-build.mjs
      # The product build's own specs (e2e/product/): no sample name, no demo switches, the "Not connected
      # yet" screen. Right after the build it serves (dist-product/, via wrangler dev, so the demo's deploy pointer that
      # `vite preview` follows stays on dist/). E2E_PREBUILT keeps the demo server Playwright also starts from building
      # again, so nothing rebuilds beside the product. Its artifacts sit under e2e-artifacts/ so a failure uploads with
      # the shard's. It runs even when the check above failed, so one log shows both.
      - if: matrix.shard == 3 && !cancelled()
        env:
          E2E_PRODUCT: "1"
          E2E_PREBUILT: "1"
          VERIFY_DIR: e2e-artifacts/product
        run: npx playwright test --project=product --forbid-only
      # include-hidden-files: Playwright's .last-run.json (each run's failed test IDs) sits in <VERIFY_DIR>/results/, and
      # targeted.yml's failed_run input re-runs exactly those failures from this artifact.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-shard-${{ matrix.shard }}
          path: app/e2e-artifacts
          include-hidden-files: true
          retention-days: 7

  # The connector hub (P4): its own package in app/hub/, installed alone (app/ isn't), so code bundled into the hub
  # from outside app/hub/ can't lean on app/'s packages. No secret, no environment. Type check, both test projects
  # (Node and workerd), the deployable and test dry-run bundles, then the bundle scan (the deployable bundle has no
  # test seam; the test bundle must be caught) and the config check (the template passes; the test config must fail).
  hub:
    # Light (about a minute), so it also runs on a fleet PR: the fast job doesn't cover app/hub. Not on a docs-only run.
    needs: changes
    if: ${{ needs.changes.outputs.docs_only == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app/hub
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache (AGENTS.md, "No Actions cache"); app/hub/package.json has no packageManager field.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.nvmrc
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run bundle
      - run: npm run bundle:test
      - name: Hub bundle scan, its own tests
        working-directory: app
        run: node --test scripts/check-hub-build.test.mjs
      - name: Hub bundle scan
        working-directory: app
        run: node scripts/check-hub-build.mjs
      - name: Hub config check, its own tests
        working-directory: app
        run: node --test scripts/check-hub-config.test.mjs
      - name: Hub config check, the template passes
        working-directory: app
        run: node scripts/check-hub-config.mjs wrangler.hub.jsonc
      - name: Hub config check, the test config fails
        working-directory: app
        run: |
          set +e
          node scripts/check-hub-config.mjs wrangler.hub.test.jsonc
          rc=$?
          set -e
          if [ "$rc" != 1 ]; then
            echo "::error::check-hub-config.mjs exited $rc on wrangler.hub.test.jsonc; it must exit 1 (the test build is never deployable)."
            exit 1
          fi

  # The TEST BUILD (P2, p2-design section 10): the product Worker under `wrangler dev` with a fresh local D1 and the
  # test issuer. No secret anywhere: the issuer's key pair is made per run and only its public half reaches the Worker.
  # P4 wave 4: the connector hub runs beside it in the same multi-config `wrangler dev` (the product's config first, then
  # wrangler.hub.test.jsonc, one --persist-to; e2e/support/test-build/issuer.ts), answering from the recorded Shopify
  # fixture with its test-only keys. No store credential.
  test-build:
    # Not on a docs-only run, and not on a fleet PR (on its branch's push instead).
    needs: changes
    if: ${{ needs.changes.outputs.docs_only == 'false' && !(github.event_name == 'pull_request' && startsWith(github.base_ref, 'fleet/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The same image as e2e (keep the tag and digest in step with it).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      # --add-host: Node's resolver doesn't always resolve *.localhost on a runner (ENOTFOUND brand.localhost), so pin the test build's hosts.
      options: --user 1001 --ipc=host --add-host=brand.localhost:127.0.0.1 --add-host=inhouse.localhost:127.0.0.1
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci
      # The hub's own packages (app/hub/ is its own package, not installed by app/'s npm ci): the hub Worker in the
      # multi-config `wrangler dev` bundles from them.
      - run: npm ci
        working-directory: app/hub
      - run: npm run build:product-test
      # The migration job, fresh install: every migration in server/migrations/ on an empty local D1. From P3 it also
      # upgrades from the last release tag and runs that tag's API specs on the new schema.
      - name: Migrations, fresh install
        run: rm -rf .wrangler/test-build && npm run test-build:migrate
      # The deployable-config check must refuse the test build's config (it sets the test flag and test origins).
      # The script's fixture tests run with test:unit (e2e shard 4). The fast job runs this same step on a fleet PR.
      # Its exit codes (AGENTS.md): 0 deployable, 1 refused, 2 usage or a crash. Only 1 counts as refusing here: a crash
      # (2) or any other code fails this step too.
      - name: The config check refuses wrangler.test.jsonc
        if: ${{ !cancelled() }}
        run: |
          rc=0
          node scripts/check-product-config.mjs wrangler.test.jsonc || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::check-product-config.mjs exited $rc on wrangler.test.jsonc; it must refuse it with exit code 1 (0 = passed a config that must never deploy, 2 = usage or a crash)."
            exit 1
          fi
          echo "check-product-config.mjs refused wrangler.test.jsonc (exit 1), as it must."
      # The eval build's template the same way, and for the reason it's there: the test issuer is on in it, so as a
      # product config it must be refused on that rule (the template also fails on its empty INHOUSE_ACCESS, which
      # alone would keep exit 1 if the test-issuer rule went).
      - name: The config check refuses wrangler.eval.jsonc
        if: ${{ !cancelled() }}
        run: |
          rc=0
          out=$(node scripts/check-product-config.mjs wrangler.eval.jsonc 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 1 ]; then
            echo "::error::check-product-config.mjs exited $rc on wrangler.eval.jsonc; it must refuse it with exit code 1 (0 = passed a config that must never deploy, 2 = usage or a crash)."
            exit 1
          fi
          # POSIX sh (the job's container runs steps under dash): a pipe, not a bash here-string.
          if ! printf '%s\n' "$out" | grep -qF 'vars.INHOUSE_TEST_BUILD is set: the test issuer must never be on in a deployable config'; then
            echo "::error::check-product-config.mjs refused wrangler.eval.jsonc, but not on the test-issuer rule it must name."
            exit 1
          fi
          echo "check-product-config.mjs refused wrangler.eval.jsonc on the test-issuer rule (exit 1), as it must."
      # The api and real projects. Their web server migrates and seeds a fresh local D1 first (prepare.mjs).
      - name: Playwright, api and real
        if: ${{ !cancelled() }}
        env:
          E2E_TEST_BUILD: "1"
          VERIFY_DIR: e2e-artifacts/test-build
        run: npx playwright test --project=api --project=real-desktop --project=real-phone --forbid-only
      # The release smoke on the test build (e2e/smoke/, read only, request only): the same checks a release runs with
      # Access service-token headers instead of the test issuer. After the api project, which proves the routes it reads.
      - name: Playwright, release smoke
        if: ${{ !cancelled() }}
        env:
          E2E_TEST_BUILD: "1"
          # Its own folder: Playwright empties its output folder at the start of a run, which would wipe the api and real
          # failure artifacts before the upload below (its path, app/e2e-artifacts, covers both folders).
          VERIFY_DIR: e2e-artifacts/test-build-smoke
        run: npx playwright test --project=smoke --forbid-only
      # The contract suite with the real client's target added (CONTRACT_REAL_ORIGIN), against a fresh test build.
      - name: Contract suite on the real client
        if: ${{ !cancelled() }}
        run: node e2e/support/test-build/serve.ts -- npx vitest run src/agent/contract
      # include-hidden-files: the .last-run.json files for targeted.yml's failed_run, as in e2e's upload.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-build
          path: app/e2e-artifacts
          include-hidden-files: true
          retention-days: 7

  # The agent runner (app/runner/, its own package): types, tests, the zod-major check, then the image build and a start
  # check. No secret here, ever: it runs the PR's code. Container tests under wrangler dev join this job in P3.
  runner:
    # Not on a docs-only run.
    needs: changes
    if: ${{ needs.changes.outputs.docs_only == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.nvmrc
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:zod
      # The harness (a local-only Worker that runs the runner under wrangler dev with the scripted model) has its own
      # package: install and type check it. It's never deployed (it refuses every request without HARNESS_LOCAL_ONLY=1).
      - name: Harness typecheck
        working-directory: app/runner/harness
        run: npm ci && npm run typecheck
      # Build context is app/, so the protocol schemas in app/shared/ can be bundled; Dockerfile.dockerignore keeps the
      # rest of app/ out. The image, its start check and the container probes don't run on a fleet PR (its branch's push
      # runs them).
      - if: ${{ !(github.event_name == 'pull_request' && startsWith(github.base_ref, 'fleet/')) }}
        run: docker build -f Dockerfile -t inhouse-runner:ci ..
      # The image starts with the guards installed and answers its health route. Until Node listens, Docker's port
      # proxy may refuse the connection or accept and close it, so the check polls on that condition, at most 30 times
      # about a second apart, and stops at once if the container has exited. A failure prints the container's log.
      - name: The image starts
        if: ${{ !(github.event_name == 'pull_request' && startsWith(github.base_ref, 'fleet/')) }}
        run: |
          docker run -d --name runner -p 8080:8080 -e EGRESS_URL=http://127.0.0.1:9 inhouse-runner:ci
          for _ in $(seq 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' runner)" != true ]; then
              echo "::error::The runner container exited"; docker logs runner; exit 1
            fi
            curl -fsS --max-time 2 http://127.0.0.1:8080/health && exit 0
            sleep 1
          done
          echo "::error::The runner never answered /health"; docker logs runner; exit 1
      # P3 R2's guards, proven in the container (app/runner/image/probes/run.ts): the real root runner with the scripted
      # model behind a fake egress, the agent's Bash and file tools under the real sandbox, and the host's wipes. Each
      # probe prints PROBE PASS|FAIL and each kernel fact FACT; any FAIL fails the step. Not part of the image: the
      # bundle is mounted read-only.
      #
      # The sandbox is bubblewrap run by a session user, and inside it the CLI's seccomp helper makes one more user
      # namespace for its own PID and mount namespace. A GitHub runner stops that in two places a Cloudflare container
      # doesn't have. Each setting below takes one of them off, none changes what a session user may do inside the
      # image, and PR #78 shows what each one stops when it's left out (and what Cloudflare gives instead):
      # - Ubuntu's AppArmor, on the runner's host. `apparmor_restrict_unprivileged_userns` gives an unprivileged user
      #   namespace no capabilities (`bwrap: setting up uid map: Permission denied`; the engine's sandboxing docs name
      #   this sysctl). And the profile the host ships for /usr/bin/bwrap (bwrap-userns-restrict) attaches by path, to
      #   the bwrap inside a container too, and takes every capability from what bwrap runs: the helper's namespace
      #   then holds none, and every sandboxed command dies on `apply-seccomp: write /proc/self/setgroups`. The sysctl
      #   doesn't reach a named profile, so the profile is unloaded.
      # - Docker's wrapping of the probe container: its seccomp profile refuses a non-root user's namespaces, its
      #   AppArmor profile refuses bwrap's mounts, and its masked /proc paths make the kernel refuse a fresh /proc.
      # The host serves probe.txt on the bridge gateway: a private address outside the container for the egress probes.
      - name: Probe setup
        if: ${{ !(github.event_name == 'pull_request' && startsWith(github.base_ref, 'fleet/')) }}
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          if [ -e /etc/apparmor.d/bwrap-userns-restrict ]; then sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict; fi
          sh image/probes/build.sh "$RUNNER_TEMP/probes"
          mkdir -p "$RUNNER_TEMP/gw" && echo GW_OK > "$RUNNER_TEMP/gw/probe.txt"
          nohup python3 -m http.server 18080 --bind 0.0.0.0 --directory "$RUNNER_TEMP/gw" > /dev/null 2>&1 &
      - name: The guards in the container
        if: ${{ !(github.event_name == 'pull_request' && startsWith(github.base_ref, 'fleet/')) }}
        run: |
          docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined \
            -v "$RUNNER_TEMP/probes:/opt/runner/probes:ro" -e PROBE_GW_PORT=18080 inhouse-runner:ci node /opt/runner/probes/run.mjs

  # A fleet PR's fast checks (phase batching): the e2e shards' checks and builds without Playwright, and the test-build
  # job's fresh-install migrations and config check, in the same image. Left to the push run: every Playwright project
  # (the product project and the test build's api, real and smoke included), the contract suite on the real client and
  # the runner image steps. Its build is the PR's preview build (preview.yml), as e2e's is on a PR into
  # main. Target: 3 to 5 minutes.
  fast:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only == 'false' && github.event_name == 'pull_request' && startsWith(github.base_ref, 'fleet/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The same image as e2e (keep the tag and digest in step with it).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --user 1001 --ipc=host
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: node --version && npm run test:unit
      - run: npm run build
        env:
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: node scripts/check-bundle.mjs
      # The preview build and its meta, exactly as e2e shard 1 uploads them on a PR into main.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-build
          path: |
            app/dist
            app/.wrangler/deploy/config.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
        run: printf '{"pr":%s,"sha":"%s"}\n' "$PR" "$SHA" > pr-meta.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-meta
          path: app/pr-meta.json
          if-no-files-found: error
          retention-days: 7
      # As e2e shard 3: the product build ships no demo code, and the deployable Worker no test issuer.
      - if: ${{ !cancelled() }}
        run: npm run build:product && npm run build:product-test && npm run build:product-eval && node scripts/check-product-build.mjs
      # As the test-build job: every migration on an empty local D1 (the fresh install), so a broken migration shows on
      # its own fleet PR, not a few merges later.
      - name: Migrations, fresh install
        if: ${{ !cancelled() }}
        run: rm -rf .wrangler/test-build && npm run test-build:migrate
      # As the test-build job: the config check must refuse wrangler.test.jsonc with exit code 1, nothing else.
      - name: The config check refuses wrangler.test.jsonc
        if: ${{ !cancelled() }}
        run: |
          rc=0
          node scripts/check-product-config.mjs wrangler.test.jsonc || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::check-product-config.mjs exited $rc on wrangler.test.jsonc; it must refuse it with exit code 1 (0 = passed a config that must never deploy, 2 = usage or a crash)."
            exit 1
          fi
          echo "check-product-config.mjs refused wrangler.test.jsonc (exit 1), as it must."

  ci:
    needs: [changes, e2e, test-build, runner, hub, fast]
    # always(): a cancelled or skipped job makes ci red, never skipped (a skipped check counts as passing). The one
    # exception is a job skipped by design: e2e and test-build on a fleet PR, fast on every other event, and e2e,
    # test-build, runner, hub and fast on a docs-only run. Each of those must be exactly skipped, and every other job
    # exactly success. changes must succeed and say exactly true or false: a docs-only pass rests on its answer alone.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every job this event runs passed (docs-only - none; a fleet PR - fast, runner and hub; otherwise every shard, the test build, the runner job and the hub job)
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          FLEET_PR: ${{ github.event_name == 'pull_request' && startsWith(github.base_ref, 'fleet/') }}
          RESULT: ${{ needs.e2e.result }}
          TEST_BUILD: ${{ needs.test-build.result }}
          RUNNER: ${{ needs.runner.result }}
          HUB: ${{ needs.hub.result }}
          FAST: ${{ needs.fast.result }}
        run: |
          echo "changes: $CHANGES (docs-only: $DOCS_ONLY)"
          echo "fleet PR (fast checks only): $FLEET_PR"
          echo "e2e: $RESULT"
          echo "test-build: $TEST_BUILD"
          echo "runner: $RUNNER"
          echo "hub: $HUB"
          echo "fast: $FAST"
          if [ "$CHANGES" = cancelled ] || [ "$RESULT" = cancelled ] || [ "$TEST_BUILD" = cancelled ] || [ "$RUNNER" = cancelled ] || [ "$HUB" = cancelled ] || [ "$FAST" = cancelled ]; then
            echo "::error::A job was cancelled or superseded by a newer run. This is not a test failure: see the newest run for this branch."
          fi
          test "$CHANGES" = success || { echo "::error::The changes job didn't succeed, so nothing says what this run must cover."; exit 1; }
          if [ "$DOCS_ONLY" = true ]; then
            echo "Docs-only: every changed file is documentation, so the app's jobs skipped by design."
            test "$RESULT" = skipped && test "$TEST_BUILD" = skipped && test "$RUNNER" = skipped && test "$HUB" = skipped && test "$FAST" = skipped
          elif [ "$DOCS_ONLY" != false ]; then
            echo "::error::The changes job's docs_only is '$DOCS_ONLY', not true or false."
            exit 1
          elif [ "$FLEET_PR" = true ]; then
            test "$FAST" = success && test "$RUNNER" = success && test "$RESULT" = skipped && test "$TEST_BUILD" = skipped && test "$HUB" = success
          else
            test "$RESULT" = success && test "$TEST_BUILD" = success && test "$RUNNER" = success && test "$HUB" = success && test "$FAST" = skipped
          fi

  pr-gates:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Dependabot's commits carry no trailer. A PR's author login is set by GitHub, unlike a commit's author.
      - name: Every commit has a Verified trailer
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          missing=""
          # A missing ref would make git log fail inside the for list, which bash doesn't stop on: fail loudly instead.
          git rev-parse --verify -q "refs/remotes/origin/$DEFAULT" > /dev/null || { echo "::error::No refs/remotes/origin/$DEFAULT"; exit 1; }
          # Commits already on the default branch passed this gate in their own PR; a PR that brings main into a
          # fleet/<topic> branch carries them again (squash commits there can't be rewritten), so skip them.
          for c in $(git log --no-merges --format=%H "$BASE..$HEAD" --not "refs/remotes/origin/$DEFAULT"); do
            t=$(git log -1 --format=%B "$c" | git interpret-trailers --parse)
            grep -qiE '^Verified:[[:space:]]*[^[:space:]]' <<< "$t" ||
              missing="$missing$(git log -1 --format='%h %s' "$c")"$'\n'
          done
          if [ -n "$missing" ]; then
            echo "::error::Commits without a Verified: trailer:"; printf '%s' "$missing"; exit 1
          fi
      - name: Flag changes to existing checks
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          paths=(app/e2e app/playwright.config.ts app/vitest.config.ts app/scripts .github/workflows .github/rulesets
            ':(glob)app/src/**/*.property.test.ts')
          files=$(git -c core.quotepath=off diff --name-status --diff-filter=MDR "$BASE...$HEAD" -- "${paths[@]}")
          [ -z "$files" ] && exit 0
          { echo "### Changed existing checks"; echo '```'; echo "$files"; echo '```'
            echo "Reviewer: the PR body must explain each one."; } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::This PR changes existing checks. See the job summary."
