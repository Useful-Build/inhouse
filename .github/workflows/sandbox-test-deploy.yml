# Deploys one same-repo PR's test build to the sandbox Cloudflare account and runs its specs there, on GitHub's hosted
# runners (moved from the private ops repo's test-deploy.yml, which stays until this one is proven). By hand only:
#   gh workflow run sandbox-test-deploy -f pr=<N> -f sha=<the PR's head SHA>                 (agent set on the container)
#   gh workflow run sandbox-test-deploy -f pr=<N> -f sha=<head> -f only="api/runs.spec.ts"  (narrower)
#   gh workflow run sandbox-test-deploy -f pr=<N> -f sha=<head> -f full=true                (every api and real spec)
# PR N gets Worker inhouse-sbx-pr<N> (and its hub inhouse-sbx-pr<N>-hub) on https://inhouse-sbx-pr<N>-brand.<zone> and
# -team.<zone>, its own D1, R2 and container application, all named by app/scripts/sandbox/names.mjs perPrNames(N). A
# redeploy of the same PR tears the old one down first; sandbox-test-deploy-cleanup.yml deletes it when the PR closes.
# Runs of different PRs go in parallel; runs of one PR queue (concurrency below).
#
# Trust. The PR's code is untrusted, and everything a run prints or uploads is public.
# - Two jobs run side by side, never mixed. `pr-code` runs the PR's code (install, build, specs) with no secret and no
#   token permission but `actions: read`. `deploy` holds CF_SANDBOX_TOKEN through the `sandbox` environment (deployment
#   branches: main only) and runs only main's code: this workflow (dispatched from main; the first step refuses any
#   other ref), main's scripts at the dispatched commit, main's lockfile with `npm ci --ignore-scripts`, main's wrangler
#   by path. It never checks out or runs the PR: from the PR it takes only the build's plain files, copied out by an
#   exact file list (scripts/sandbox/deploy-config.mjs), and only after the sandbox lock passes on the final config.
# - The test issuer's key pair is made in `pr-code`, its only user. Only the public JWKS leaves it (an artifact); the
#   private half stays in that job's temp folder. The build and the image cross the same way. Both are built from the
#   public repo's code, so a public artifact holds nothing new; they live 1 day.
# - The account id and the zone come in as secrets, so GitHub masks them in every log line (a variable would print in
#   the first step that reads it). The specs' output goes through a filter that hides any JWT it prints.
# - Only same-repo PRs, open, at exactly the given head SHA (forks never deploy). Dispatching needs write access.
# After a failure, dispatch again, never re-run: a re-run attempt is refused (its artifacts would clash).
name: sandbox-test-deploy

on:
  workflow_dispatch:
    inputs:
      pr:
        description: The PR number (same repo, open).
        required: true
        type: string
      sha:
        description: The PR's head commit SHA (40 hex). The run refuses any other.
        required: true
        type: string
      containers:
        description: Build and push the runner image (the test build has the runner container).
        type: boolean
        default: true
      specs:
        description: Run specs against the deployment.
        type: boolean
        default: true
      full:
        description: Run every api and real spec, not only the agent set (the specs that drive the container).
        type: boolean
        default: false
      only:
        description: 'Narrow the set to these spec files, space-separated, e.g. "api/runs.spec.ts real/socket-csp.spec.ts".'
        type: string
        default: ''

permissions: {}

concurrency:
  group: sandbox-test-deploy-pr-${{ inputs.pr }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RUN_ID: ${{ github.run_id }}
  REPO: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      sha: ${{ steps.pr.outputs.sha }}
      only: ${{ steps.only.outputs.only }}
    steps:
      - name: Only from main, first attempt
        env:
          REF: ${{ github.ref }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          [ "$REF" = refs/heads/main ] || { echo "::error::sandbox-test-deploy runs only from main (this run: $REF)"; exit 1; }
          [ "$ATTEMPT" = 1 ] || { echo "::error::dispatch again instead of re-running (attempt $ATTEMPT)"; exit 1; }
      - name: The PR and its head
        id: pr
        env:
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$PR" =~ ^[1-9][0-9]{0,5}$ ]] || { echo "::error::pr must be a PR number"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be 40 lowercase hex"; exit 1; }
          gh api "repos/$REPO/pulls/$PR" > "$RUNNER_TEMP/pr.json"
          state=$(jq -r .state "$RUNNER_TEMP/pr.json")
          head_repo=$(jq -r .head.repo.full_name "$RUNNER_TEMP/pr.json")
          head_sha=$(jq -r .head.sha "$RUNNER_TEMP/pr.json")
          [ "$state" = open ] || { echo "::error::PR $PR is $state"; exit 1; }
          [ "$head_repo" = "$REPO" ] || { echo "::error::PR $PR comes from $head_repo, not $REPO (forks never deploy)"; exit 1; }
          [ "$head_sha" = "$SHA" ] || { echo "::error::PR $PR's head is $head_sha, not $SHA"; exit 1; }
          { echo "pr=$PR"; echo "sha=$SHA"; } >> "$GITHUB_OUTPUT"
      # A strict allowlist: spec files under e2e/api or e2e/real by bare path, nothing that could be a flag, a glob or
      # another folder. Whether each one is in the chosen set is checked against the PR's tree in pr-code.
      - name: The spec filter
        id: only
        env:
          ONLY: ${{ inputs.only }}
          SPECS: ${{ inputs.specs }}
        run: |
          read -r -a items <<< "$ONLY"
          if [ "${#items[@]}" -eq 0 ]; then echo "only=" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "$SPECS" = true ] || { echo "::error::only needs specs=true"; exit 1; }
          [ "${#items[@]}" -le 30 ] || { echo "::error::only takes at most 30 spec files"; exit 1; }
          for f in "${items[@]}"; do
            [[ "$f" =~ ^(api|real)/[a-z0-9][a-z0-9-]{0,80}\.spec\.ts$ ]] || { echo "::error::only: '$f' is not a spec file like api/runs.spec.ts or real/socket-csp.spec.ts"; exit 1; }
          done
          echo "only=${items[*]}" >> "$GITHUB_OUTPUT"

  # The PR's code: no secret, no token permission but reading this run's jobs (the wait for the deploy below).
  pr-code:
    name: pr-code
    needs: check
    runs-on: ubuntu-latest
    # Build (~10 min) beside the deploy job, the wait for the deploy (up to 45), the warm-up (up to 14), the specs.
    timeout-minutes: 150
    permissions:
      actions: read
    env:
      PR: ${{ needs.check.outputs.pr }}
      SHA: ${{ needs.check.outputs.sha }}
    steps:
      # First, so the deploy job never waits for it. The private half stays in this job's temp folder, 0600.
      - name: The test issuer's key pair (the private half never leaves this job)
        run: |
          umask 077
          mkdir "$RUNNER_TEMP/issuer" "$RUNNER_TEMP/jwks"
          node - "$RUNNER_TEMP" <<'EOF'
          const { generateKeyPairSync, randomBytes } = require('node:crypto');
          const { writeFileSync } = require('node:fs');
          const dir = process.argv[2];
          const { publicKey, privateKey } = generateKeyPairSync('rsa', { modulusLength: 2048 });
          const kid = randomBytes(8).toString('hex');
          writeFileSync(`${dir}/jwks/jwks.json`, JSON.stringify({ keys: [{ ...publicKey.export({ format: 'jwk' }), kid, alg: 'RS256', use: 'sig' }] }));
          writeFileSync(`${dir}/issuer/private.jwk.json`, JSON.stringify({ ...privateKey.export({ format: 'jwk' }), kid, alg: 'RS256' }));
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: issuer-jwks
          path: ${{ runner.temp }}/jwks/jwks.json
          retention-days: 1
          if-no-files-found: error
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: pr/app/.nvmrc
          package-manager-cache: false
      - working-directory: pr/app
        run: npm ci
      - working-directory: pr/app
        run: npm run build:product-test
      # Only the Worker's folder, the assets and the migrations (deploy-config.mjs refuses anything else).
      - name: Collect the build
        run: |
          mkdir -p "$RUNNER_TEMP/out/dist" "$RUNNER_TEMP/out/migrations"
          cp -R pr/app/dist-product-test/inhouse_product pr/app/dist-product-test/client "$RUNNER_TEMP/out/dist/"
          cp pr/app/server/migrations/*.sql "$RUNNER_TEMP/out/migrations/"
      - name: Build the hub's test bundle
        working-directory: pr/app
        run: |
          if [ ! -f wrangler.hub.test.jsonc ]; then echo "no hub in this PR"; exit 0; fi
          (cd hub && npm ci && npm run bundle:test)
          mkdir -p "$RUNNER_TEMP/out/hub"
          cp dist-hub-test/*.js "$RUNNER_TEMP/out/hub/"
          cp wrangler.hub.test.jsonc "$RUNNER_TEMP/out/hub/wrangler.jsonc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: ${{ runner.temp }}/out/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
      # Cloudflare Containers runs linux/amd64, which the hosted runner builds natively.
      - name: Build the runner image
        if: inputs.containers
        working-directory: pr/app/runner
        run: |
          docker build --platform linux/amd64 -f Dockerfile -t "inhouse-sbx-pr$PR:$SHA" ..
          arch=$(docker image inspect -f "{{.Architecture}}" "inhouse-sbx-pr$PR:$SHA")
          [ "$arch" = amd64 ] || { echo "::error::the runner image is linux/$arch; Cloudflare Containers needs linux/amd64"; exit 1; }
          mkdir "$RUNNER_TEMP/image"
          docker save "inhouse-sbx-pr$PR:$SHA" | zstd -q -T0 -o "$RUNNER_TEMP/image/image.tar.zst"
      - if: inputs.containers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image/image.tar.zst
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: Install the browser
        if: inputs.specs
        working-directory: pr/app
        run: npx playwright install --with-deps chromium
      - name: Wait for the deploy job
        if: inputs.specs
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          deadline=$((SECONDS + 2700))
          while :; do
            state=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs" --paginate --jq '.jobs[] | select(.name == "deploy") | "\(.status) \(.conclusion)"')
            case "$state" in
              "completed success") echo "the deploy job passed"; break ;;
              completed*) echo "::error::the deploy job ended: $state"; exit 1 ;;
            esac
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::no finished deploy job within 45 minutes ($state)"; exit 1; }
            sleep 15
          done
      # Masked in every later line: the zone (in both hosts). A repository secret, so this no-token job can mask it.
      - name: The deployment's hosts
        if: inputs.specs
        env:
          SBX_ZONE: ${{ secrets.SBX_ZONE }}
        run: |
          [ -n "$SBX_ZONE" ] || { echo "::error::the repository secret SBX_ZONE is not set"; exit 1; }
          { echo "BASE_URL=https://inhouse-sbx-pr$PR-brand.$SBX_ZONE"; echo "TEST_BUILD_INHOUSE_URL=https://inhouse-sbx-pr$PR-team.$SBX_ZONE"; } >> "$GITHUB_ENV"
      # The release job's warm-up before any spec sends a turn (p3-design sections 3 and 7): drain, wait until nothing is
      # live, starting or ending, warm-up every 5 s until 200, then undrain only if the drain is still on. Signed as the
      # test build's release service with this job's test-issuer key, through the PR's own helpers.
      - name: Warm the runners (release service, the test issuer's key)
        id: warm
        if: inputs.specs && inputs.containers
        timeout-minutes: 14
        working-directory: pr/app
        run: |
          export TEST_ISSUER_PRIVATE_JWK_FILE="$RUNNER_TEMP/issuer/private.jwk.json"
          node --input-type=module - <<'EOF' 2>&1 | sed -E 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*/<jwt>/g'
          import { readFileSync } from 'node:fs'
          const { mintService } = await import(`${process.cwd()}/server/auth/test-issuer-mint.ts`)
          const { appOrigin, testAccessConfig } = await import(`${process.cwd()}/e2e/support/test-build/issuer.ts`)
          const access = testAccessConfig()
          const aud = access.apps.find(a => a.name === 'brand')?.aud
          const clientId = Object.entries(access.serviceTokens).find(([, name]) => name === 'release')?.[0]
          const fail = message => { console.log(`::error::${message}`); process.exit(1) }
          if (!aud || !clientId) fail('the test build has no brand app or no release service token')
          const key = JSON.parse(readFileSync(process.env.TEST_ISSUER_PRIVATE_JWK_FILE, 'utf8'))
          const origin = appOrigin('brand')
          const start = Date.now()
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms))
          const call = async (method, path) => {
            const headers = { 'Cf-Access-Jwt-Assertion': await mintService({ key, aud, clientId }) }
            if (method !== 'GET') Object.assign(headers, { Origin: origin, 'content-type': 'application/json' })
            const res = await fetch(origin + path, { method, headers, body: method === 'POST' ? '{}' : undefined, signal: AbortSignal.timeout(180_000) })
            const body = await res.text()
            console.log(`${method} ${path}: ${res.status} ${body.slice(0, 200)} (${Date.now() - start} ms)`)
            return { status: res.status, body }
          }
          if ((await call('POST', '/api/ops/drain')).status !== 200) fail('the drain was refused')
          const settleBy = Date.now() + 120_000
          while (true) {
            const state = await call('GET', '/api/ops/drain')
            if (state.status !== 200) fail('the drain state was refused')
            const s = JSON.parse(state.body)
            if (s.live === 0 && s.starting === 0 && s.ending === 0) break
            if (Date.now() > settleBy) fail('runs still in flight 2 minutes after the drain')
            await wait(5000)
          }
          const warmBy = Date.now() + 600_000
          while (true) {
            const warm = await call('POST', '/api/ops/warmup')
            if (warm.status === 200) break
            if (warm.status !== 503) fail(`the warm-up answered ${warm.status}`)
            if (Date.now() > warmBy) fail('no warm-up 200 within 10 minutes')
            await wait(5000)
          }
          const after = await call('GET', '/api/ops/drain')
          if (after.status !== 200) fail('the drain state was refused')
          if (JSON.parse(after.body).drainingUntilMs != null && (await call('DELETE', '/api/ops/drain')).status !== 200) fail('the undrain was refused')
          console.log(`runners ready ${Date.now() - start} ms after the step started`)
          EOF
      # The set: with containers and without `full`, the agent set: every api and real spec file that calls
      # needsContainer() (e2e/api/chat-kit.ts) or skips unless E2E_TEST_BUILD_REMOTE because it needs a container. With
      # `full` (or no containers), every api and real spec. Discovered at the PR's head, never a fixed list, so a PR's new
      # container spec joins the set. `only` narrows that set, and each named file must be in it. The run must execute
      # (not skip) at least one test, and so must every file `only` names (JSON report, not the listing).
      - name: Specs against the deployment
        if: inputs.specs
        working-directory: pr/app
        env:
          ONLY: ${{ needs.check.outputs.only }}
          FULL: ${{ inputs.full }}
          CONTAINERS: ${{ inputs.containers }}
          E2E_TEST_BUILD_REMOTE: "1"
        run: |
          export TEST_ISSUER_PRIVATE_JWK_FILE="$RUNNER_TEMP/issuer/private.jwk.json" PLAYWRIGHT_JSON_OUTPUT_NAME="$RUNNER_TEMP/report.json"
          if [ "$FULL" = true ] || [ "$CONTAINERS" != true ]; then
            mapfile -t base < <(ls e2e/api/*.spec.ts e2e/real/*.spec.ts)
            set_name="every api and real spec"
          else
            mapfile -t base < <({ grep -lE 'needsContainer\(\)' e2e/api/*.spec.ts e2e/real/*.spec.ts; grep -lE 'skip\(\s*!process\.env\.E2E_TEST_BUILD_REMOTE.*container' e2e/api/*.spec.ts e2e/real/*.spec.ts; } | sort -u)
            set_name="the agent set"
          fi
          [ "${#base[@]}" -gt 0 ] || { echo "::error::$set_name is empty at this commit"; exit 1; }
          files=("${base[@]}")
          if [ -n "$ONLY" ]; then
            read -r -a want <<< "$ONLY"
            files=()
            for f in "${want[@]}"; do
              printf '%s\n' "${base[@]}" | grep -qxF "e2e/$f" || { echo "::error::only: e2e/$f is not in $set_name at this commit (full=true widens the set)"; exit 1; }
              files+=("e2e/$f")
            done
          fi
          echo "running $set_name${ONLY:+, narrowed by only}: ${files[*]}"
          rc=0
          npx playwright test "${files[@]}" --project=api --project=real-desktop --project=real-phone --forbid-only --reporter=list,json 2>&1 \
            | sed -E 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*/<jwt>/g' || rc=$?
          [ -f "$PLAYWRIGHT_JSON_OUTPUT_NAME" ] || { echo "::error::no JSON report (exit $rc)"; exit 1; }
          jq -e '(.stats.expected + .stats.unexpected + .stats.flaky) >= 1' "$PLAYWRIGHT_JSON_OUTPUT_NAME" > /dev/null || { echo "::error::no test ran (all skipped or none matched)"; exit 1; }
          # A file named in `only` must have run (not skipped) at least one test: listing isn't running.
          for f in ${ONLY}; do
            jq -e --arg f "$f" '[.suites[] | select(.file == $f) | .. | objects | select(has("tests")) | .tests[].status] | any(. != "skipped")' \
              "$PLAYWRIGHT_JSON_OUTPUT_NAME" > /dev/null || { echo "::error::only: every test in e2e/$f skipped or none ran"; exit 1; }
          done
          exit "$rc"

  # main's code only, and the token. Starts with pr-code (setup overlaps the build), then waits for the build.
  deploy:
    name: deploy
    needs: check
    runs-on: ubuntu-latest
    # The wait for the build (up to 30 min) and the deploy (~10).
    timeout-minutes: 45
    environment: sandbox
    permissions:
      contents: read
      actions: read
    env:
      PR: ${{ needs.check.outputs.pr }}
      SHA: ${{ needs.check.outputs.sha }}
      CONTAINERS: ${{ inputs.containers }}
    steps:
      - name: Only from main
        env:
          REF: ${{ github.ref }}
        run: |
          [ "$REF" = refs/heads/main ] || { echo "::error::sandbox-test-deploy runs only from main (this run: $REF)"; exit 1; }
      # Secrets, not variables, so GitHub masks them in every line of this job.
      - name: The sandbox account and zone are set
        env:
          CF_SANDBOX_ACCOUNT_ID: ${{ secrets.CF_SANDBOX_ACCOUNT_ID }}
          SBX_ZONE: ${{ secrets.SBX_ZONE }}
          CF_SANDBOX_TOKEN: ${{ secrets.CF_SANDBOX_TOKEN }}
        run: |
          for v in CF_SANDBOX_ACCOUNT_ID SBX_ZONE CF_SANDBOX_TOKEN; do [ -n "${!v}" ] || { echo "::error::the secret $v is not set"; exit 1; }; done
      # main at the dispatched commit (this workflow's own), never the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: main/app/.nvmrc
          package-manager-cache: false
      # main's lockfile, no install scripts: wrangler and what seed-remote imports.
      - working-directory: main/app
        run: npm ci --ignore-scripts
      - name: Wait for the build
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          want=(issuer-jwks build)
          if [ "$CONTAINERS" = true ]; then want+=(image); fi
          deadline=$((SECONDS + 1800))
          while :; do
            have=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" --jq '.artifacts[].name')
            missing=()
            for n in "${want[@]}"; do grep -qxF "$n" <<< "$have" || missing+=("$n"); done
            if [ "${#missing[@]}" -eq 0 ]; then echo "the build is in"; break; fi
            state=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs" --paginate --jq '.jobs[] | select(.name == "pr-code") | .status')
            [ "$state" != completed ] || { echo "::error::pr-code ended without ${missing[*]}"; exit 1; }
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::no ${missing[*]} within 30 minutes"; exit 1; }
            sleep 15
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: ${{ runner.temp }}/artifact
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: issuer-jwks
          path: ${{ runner.temp }}/issuer
      - if: inputs.containers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image
      - name: Write PR N's config (exact file list, the lock in process)
        env:
          CF_SANDBOX_ACCOUNT_ID: ${{ secrets.CF_SANDBOX_ACCOUNT_ID }}
          SBX_ZONE: ${{ secrets.SBX_ZONE }}
        run: |
          tag=()
          if [ "$CONTAINERS" = true ]; then tag=(--image-tag "$SHA"); fi
          node main/app/scripts/sandbox/deploy-config.mjs --app main/app --pr "$PR" --artifact "$RUNNER_TEMP/artifact" \
            --out "$RUNNER_TEMP/deploy" --jwks "$RUNNER_TEMP/issuer/jwks.json" "${tag[@]}"
      - name: The sandbox lock on the final files
        working-directory: main/app
        env:
          CF_SANDBOX_ACCOUNT_ID: ${{ secrets.CF_SANDBOX_ACCOUNT_ID }}
          SBX_ZONE: ${{ secrets.SBX_ZONE }}
        run: |
          node scripts/check-product-config.mjs --sandbox --per-pr "$PR" "$RUNNER_TEMP/deploy/inhouse_product/wrangler.json"
          node scripts/check-product-config.mjs --sandbox --per-pr "$PR" "$RUNNER_TEMP/deploy/migrate/wrangler.json"
          if [ -f "$RUNNER_TEMP/deploy/hub/wrangler.json" ]; then node scripts/check-product-config.mjs --sandbox --per-pr "$PR" --hub "$RUNNER_TEMP/deploy/hub/wrangler.json"; fi
      # Loading runs nothing from the image; it gets its own step, with no secret in it.
      - name: Load the runner image
        if: inputs.containers
        run: |
          zstd -dc "$RUNNER_TEMP/image/image.tar.zst" | docker load
          docker image inspect "inhouse-sbx-pr$PR:$SHA" > /dev/null
      # The config already names this reference, and the lock has passed on it. Any email address wrangler might print
      # (its account listing on an auth error) is hidden.
      - name: Push the runner image
        if: inputs.containers
        working-directory: main/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_SANDBOX_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_SANDBOX_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: node node_modules/wrangler/bin/wrangler.js containers push "inhouse-sbx-pr$PR:$SHA" 2>&1 | sed -E 's/[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}/<email>/g'
      - name: Tear down, create, migrate, seed, deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_SANDBOX_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_SANDBOX_ACCOUNT_ID }}
          CF_SANDBOX_ACCOUNT_ID: ${{ secrets.CF_SANDBOX_ACCOUNT_ID }}
