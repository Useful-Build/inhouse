# The nightly guard check (E-9, 2026-11-21): P3 R2's container probes (P3 Acc 5's proof) every night on main, with
# app/scripts/nightly/probes.sh. That script builds the runner image from the checked-out code and runs the probe bundle
# with the exact `docker run` flags of ci.yml's runner job (nightly.test.mjs fails when they differ), after the same two
# host settings as ci.yml's "Probe setup" (why each is needed is written there). Any probe FAIL fails the run.
# No eval step: a paid eval run needs the test issuer's private key, which only the private ops repo holds (decision 5),
# and a nightly eval starts only once the baseline's cost is measured (decision 4). The only secrets here are the
# connector job's three below.
# The connector check (P4 Acc 9): W1's live project (app/test/connectors/shopify/**/*.live.ts, through the hub's
# `npm run test:live`) against the Shopify read fixture store, read-only: it never reseeds or writes. The fixture app's
# credentials are secrets of the `shopify-read-fixture` environment (SHOPIFY_SHOP, SHOPIFY_CLIENT_ID,
# SHOPIFY_CLIENT_SECRET, the names live-run.ts reads), handed to that one step only, never to any ci.yml job. Until the
# live project is on main and all three secrets are set, the job skips with a notice; after that a failed case fails
# the night. One or two of the three set is a misconfiguration and fails.
# The monthly A-seed re-seed is not here: it needs the seed app's write_orders credential, and a scheduled writer would
# put a write credential in a workflow. It runs by hand on the Mac until the merchant-org fixture lands (before
# 2027-01-18); revisit then.
# Run by hand: gh workflow run nightly (main only: a dispatch from another branch skips both jobs).
# A failure opens one issue ("Nightly guard check failing", label nightly, assigned) or comments on the open one.
# GitHub disables a scheduled workflow after 60 days without repository activity in a public repo (see monitor.yml);
# re-enable it in the Actions tab (or gh workflow enable nightly).
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  probes:
    # Main's code only: the schedule runs on the default branch, and a dispatch from any other branch does nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.nvmrc
      - name: The guards in the container
        run: sh app/scripts/nightly/probes.sh

  connectors:
    # Main's code only, as probes.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: shopify-read-fixture
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Presence only: each secret reaches this step as true or false, never its value.
      - name: Live project and secrets present
        id: gate
        shell: bash
        env:
          HAS_SHOP: ${{ secrets.SHOPIFY_SHOP != '' }}
          HAS_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID != '' }}
          HAS_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET != '' }}
        run: |
          # A missing folder is the absent case (before P4 lands), so find's complaint about it is dropped.
          live=$(find app/test/connectors/shopify -name '*.live.ts' 2>/dev/null || true)
          if [ -z "$live" ] || [ ! -f app/hub/package.json ]; then
            echo "::notice title=Connector check skipped::The live project (app/test/connectors/shopify/**/*.live.ts, app/hub) isn't on main yet."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set=0
          for v in "$HAS_SHOP" "$HAS_CLIENT_ID" "$HAS_CLIENT_SECRET"; do if [ "$v" = true ]; then set=$((set + 1)); fi; done
          if [ "$set" -eq 0 ]; then
            echo "::warning title=Connector check skipped::The live project is on main but the shopify-read-fixture environment has none of SHOPIFY_SHOP, SHOPIFY_CLIENT_ID, SHOPIFY_CLIENT_SECRET."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$set" -ne 3 ]; then
            echo "::error title=Connector secrets incomplete::shopify-read-fixture needs all of SHOPIFY_SHOP ($HAS_SHOP), SHOPIFY_CLIENT_ID ($HAS_CLIENT_ID), SHOPIFY_CLIENT_SECRET ($HAS_CLIENT_SECRET)."
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      # No cache (AGENTS.md, "No Actions cache"), as ci.yml's hub job.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: app/.nvmrc
      - name: Install the hub
        if: steps.gate.outputs.run == 'true'
        working-directory: app/hub
        run: npm ci
      # The filter keeps the run to the connector files: test/upstreams/shopify/record.live.ts (the recorder) never runs.
      - name: Shopify connectors against the read fixture
        if: steps.gate.outputs.run == 'true'
        working-directory: app/hub
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: npm run test:live -- test/connectors/shopify/

  # A failed night reaches a person (as monitor.yml does): one open issue titled TITLE, labelled LABEL and assigned,
  # commented on by every later failure until someone closes it. Its own job, so only it may write issues, and it runs no
  # repository code: no checkout, gh only.
  notify:
    needs: [probes, connectors]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      TITLE: Nightly guard check failing
      LABEL: nightly
      # Assigned on every new issue, so a failure always reaches a person.
      ASSIGNEE: wasimjalali
    steps:
      - name: Open or update the issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROBES: ${{ needs.probes.result }}
          CONNECTORS: ${{ needs.connectors.result }}
        run: |
          numbers=$(gh api --paginate "repos/$REPO/issues?state=open&labels=$LABEL&per_page=100" \
            --jq '.[] | select(.pull_request == null and .title == env.TITLE) | .number')
          open=$(head -n 1 <<< "$numbers")
          body=$(printf 'The nightly check failed at %s (container guard probes: %s, Shopify connectors: %s).\n\nRun: %s\n' \
            "$(date -u '+%Y-%m-%d %H:%M UTC')" "$PROBES" "$CONNECTORS" "$RUN_URL")
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$REPO" --body "$body"
            echo "Commented on #$open"
          else
            gh label create "$LABEL" --repo "$REPO" --force --color B60205 --description "Opened by the nightly guard check"
            gh issue create --repo "$REPO" --title "$TITLE" --label "$LABEL" --assignee "$ASSIGNEE" --body "$body"
          fi
